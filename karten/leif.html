<article id="karte-leif">
  <style>
    #karte-leif { position: relative; background: #F4F5F7 !important; color: #1F2933 !important; border: 1px solid #C9CED6 !important; border-radius: 10px !important; padding-top: 44px !important; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 6px 18px rgba(15, 23, 42, .18); overflow: hidden; }
    #karte-leif::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 30px; background: #E3E6EB; border-bottom: 1px solid #C9CED6; }
    #karte-leif::after { content: ""; position: absolute; top: 11px; left: 12px; width: 9px; height: 9px; border-radius: 50%; background: #E5534B; box-shadow: 15px 0 0 #E2B93B, 30px 0 0 #4CAF50; }
    #karte-leif .rolle { position: absolute; top: 0; left: 0; right: 0; margin: 0 !important; height: 30px; line-height: 30px; text-align: center; font-size: 12px; color: #52606D; letter-spacing: .03em; }
    #karte-leif h2 { display: flex; align-items: center; gap: 10px; color: #1F2933; }
    #karte-leif h2::before { content: "L"; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(160deg, #3E6E9E, #24476B); color: #fff; font-size: 18px; font-weight: 700; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .2); }
    #karte-leif p:last-of-type { border: 1px solid #C9CED6; background: #fff; border-radius: 4px; padding: 8px 10px; font-size: 14px; }
    #karte-leif p:last-of-type::after { content: "|"; margin-left: 2px; color: #3E6E9E; animation: leif-cursor 1s steps(2, start) infinite; }
    #karte-leif:hover { box-shadow: 0 10px 24px rgba(15, 23, 42, .25); transform: translateY(-2px); transition: transform .2s, box-shadow .2s; }
    @keyframes leif-cursor { to { visibility: hidden; } }
  </style>
  <p class="rolle">GF · Immobilien</p>
  <h2>Leif</h2>
  <p>Ich baue ein Programm, das Webseiten fremder Anbieter automatisch mit Daten ausfüllt.</p>
</article>
