<article id="karte-sophia">
  <style>
    #karte-sophia {
      position: relative;
      overflow: hidden;
      padding: 1.8rem 1.5rem;
      border-radius: 22px;
      color: #ffffff;
      background: linear-gradient(120deg, #ff3d7f, #ff9f1c, #ffd23f, #2ec4b6, #3a86ff, #8338ec, #ff3d7f);
      background-size: 250% 250%;
      animation: sophia-farbfluss 12s ease infinite;
      box-shadow: 0 12px 30px rgba(131, 56, 236, 0.35);
      transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.35s ease;
    }
    #karte-sophia::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 0 4px, transparent 5px) 10% 20% / 90px 90px,
        radial-gradient(circle, rgba(255, 210, 63, 0.95) 0 3px, transparent 4px) 40% 70% / 70px 70px,
        radial-gradient(circle, rgba(58, 134, 255, 0.9) 0 5px, transparent 6px) 80% 30% / 110px 110px,
        radial-gradient(circle, rgba(255, 61, 127, 0.9) 0 3px, transparent 4px) 60% 10% / 60px 60px;
      opacity: 0.55;
      animation: sophia-konfetti 18s linear infinite;
      pointer-events: none;
    }
    #karte-sophia::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      background: rgba(40, 10, 80, 0.2);
      backdrop-filter: blur(2px);
      pointer-events: none;
    }
    #karte-sophia > * {
      position: relative;
      z-index: 1;
    }
    #karte-sophia:hover {
      transform: translateY(-8px) rotate(-1.2deg) scale(1.02);
      box-shadow: 0 20px 45px rgba(255, 61, 127, 0.45);
    }
    #karte-sophia .rolle {
      display: inline-block;
      margin: 0 0 0.6rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2b1150;
      background: #ffd23f;
    }
    #karte-sophia h2 {
      display: inline-block;
      margin: 0 0 0.8rem;
      font-size: 2.6rem;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 3px 3px 0 #ff3d7f, 6px 6px 0 #3a86ff;
      transform-origin: left bottom;
      animation: sophia-huepfen 3s ease-in-out infinite;
    }
    #karte-sophia:hover h2 {
      text-shadow: 3px 3px 0 #ffd23f, 6px 6px 0 #2ec4b6;
    }
    #karte-sophia p {
      line-height: 1.55;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    #karte-sophia a {
      color: #ffd23f;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid #ffd23f;
    }
    @keyframes sophia-farbfluss {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes sophia-konfetti {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-90px) rotate(8deg); }
    }
    @keyframes sophia-huepfen {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      40% { transform: translateY(-4px) rotate(-2deg); }
      60% { transform: translateY(0) rotate(1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #karte-sophia,
      #karte-sophia::before,
      #karte-sophia h2 { animation: none; }
    }
  </style>
  <p class="rolle">Marketing- &amp; Eventmanagerin · Rotonda Business Club</p>
  <h2>Sophia</h2>
  <p>Ich baue KI-gestützte Abläufe für unsere Events: von der Konzeption über die Einladung bis zur Nachbereitung – weniger Handarbeit, mehr Zeit für die Menschen im Raum.</p>
</article>
