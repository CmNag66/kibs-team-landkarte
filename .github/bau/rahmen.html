<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Modul-4-Wand · KI Business School</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(40,161,215,.25), rgba(40,161,215,0) 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(255,189,89,.12), rgba(255,189,89,0) 60%),
      #021E2B;
  }
  header { max-width: 1280px; margin: 0 auto; padding: 48px 24px 24px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .augenbraue { margin: 0 0 10px; color: #28A1D7; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(40px, 6vw, 72px); line-height: 1; }
  h1 span { color: #FFBD59; }
  .zahl { font-size: 18px; color: #A9C0CC; }
  .zahl b { font-size: 44px; color: #FFBD59; font-family: Georgia, serif; margin-right: 6px; }
  #wand { max-width: 1280px; margin: 0 auto; padding: 8px 24px 64px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  /* Grundform jeder Karte. Jede Karte darf sich mit #karte-<name> selbst umstylen. */
  #wand > article {
    position: relative; min-height: 180px; padding: 20px; border-radius: 18px; overflow: hidden;
    background: #0A3A52; border: 1px solid rgba(40,161,215,.3); animation: rein .6s ease-out both;
  }
  #wand > article h2 { margin: 0 0 4px; font-size: 24px; }
  #wand > article p { margin: 6px 0 0; line-height: 1.45; }
  #wand > article a { color: inherit; }
  @keyframes rein { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  footer { text-align: center; color: #7F9BAA; font-size: 13px; padding: 0 24px 32px; }
</style>
</head>
<body>
<header>
  <div>
    <p class="augenbraue">KI Business School · Modul 4 · Ein Projekt, viele Hände</p>
    <h1>Die Modul-4-<span>Wand.</span></h1>
  </div>
  <p class="zahl"><b id="zahl">{{ZAHL}}</b>Karten</p>
</header>
<main id="wand">
{{KARTEN}}
</main>
<footer>Jede Karte ist eine eigene Datei in <code>karten/</code>. Gebaut mit Claude Code, live über GitHub Pages. Stand: {{STAND}}</footer>
<script>
  // Lädt die Wand alle 15 Sekunden neu, ohne Flackern. Neue Karten fliegen rein.
  setInterval(async () => {
    try {
      const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const neu = doc.getElementById("wand"), alt = document.getElementById("wand");
      if (neu && neu.innerHTML !== alt.innerHTML) {
        document.head.querySelectorAll("style[data-karte]").forEach((s) => s.remove());
        alt.innerHTML = neu.innerHTML;
        document.getElementById("zahl").textContent = doc.getElementById("zahl").textContent;
      }
    } catch (e) {}
  }, 15000);
</script>
</body>
</html>
